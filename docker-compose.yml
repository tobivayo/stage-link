services:
  postgres:
    image: postgres:17-alpine
    container_name: stagelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stagelink}
      POSTGRES_USER: ${POSTGRES_USER:-stagelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stagelink_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - stagelink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stagelink_postgres_data:
