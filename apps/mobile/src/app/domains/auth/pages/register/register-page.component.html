<ion-content class="auth-content">
  <main class="auth-card auth-card--wide" aria-labelledby="register-title">
    <ion-text>
      <h1 id="register-title">Sumate a StageLink</h1>
      <p>Creá tu cuenta base. Los perfiles profesionales se completarán después.</p>
    </ion-text>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field-grid">
        <ion-item>
          <ion-input label="Nombre" labelPlacement="stacked" formControlName="firstName" />
        </ion-item>
        <ion-item>
          <ion-input label="Apellido" labelPlacement="stacked" formControlName="lastName" />
        </ion-item>
      </div>
      <ion-item>
        <ion-input
          type="email"
          label="Email"
          labelPlacement="stacked"
          autocomplete="email"
          formControlName="email"
        />
      </ion-item>
      <ion-item>
        <ion-input
          label="Ubicación inicial (opcional)"
          labelPlacement="stacked"
          formControlName="locationText"
        />
      </ion-item>
      <ion-item>
        <ion-input
          type="password"
          label="Contraseña"
          labelPlacement="stacked"
          autocomplete="new-password"
          helperText="10+ caracteres, mayúscula, minúscula, número y símbolo."
          formControlName="password"
        />
      </ion-item>
      <ion-item lines="none">
        <ion-checkbox formControlName="termsAccepted" justify="start">
          Acepto los términos y condiciones.
        </ion-checkbox>
      </ion-item>

      @if (error()) {
        <p class="form-error" role="alert">{{ error() }}</p>
      }

      <ion-button type="submit" expand="block" [disabled]="loading()">
        @if (loading()) {
          <ion-spinner name="crescent" />
        } @else {
          Crear cuenta
        }
      </ion-button>
    </form>

    <a routerLink="/auth/login">Ya tengo una cuenta</a>
  </main>
</ion-content>
