<ion-header
  ><ion-toolbar color="dark"
    ><ion-buttons slot="start"><ion-back-button defaultHref="/profile/bands" /></ion-buttons
    ><ion-title>{{ bandId ? 'Editar proyecto' : 'Nuevo proyecto' }}</ion-title></ion-toolbar
  ></ion-header
>
<ion-content
  ><main class="page-shell">
    <form [formGroup]="form" (ngSubmit)="save()" class="form-stack">
      <ion-item
        ><ion-input label="Nombre" labelPlacement="stacked" formControlName="name"
      /></ion-item>
      <ion-item
        ><ion-textarea label="Descripción" labelPlacement="stacked" formControlName="description"
      /></ion-item>
      <ion-item
        ><ion-input label="Géneros (por coma)" labelPlacement="stacked" formControlName="genres"
      /></ion-item>
      <ion-item
        ><ion-input label="Influencias" labelPlacement="stacked" formControlName="influences"
      /></ion-item>
      <ion-item
        ><ion-input
          label="Ubicación o zona"
          labelPlacement="stacked"
          formControlName="locationText"
      /></ion-item>
      <ion-item
        ><ion-input
          type="url"
          label="URL de imagen"
          labelPlacement="stacked"
          formControlName="imageUrl"
      /></ion-item>
      <ion-item
        ><ion-select label="Visibilidad" formControlName="visibility">
          @for (item of visibility; track item) {
            <ion-select-option [value]="item">{{ item }}</ion-select-option>
          }
        </ion-select></ion-item
      >
      <ion-item
        ><ion-select label="Visibilidad de ubicación" formControlName="locationVisibility">
          @for (item of visibility; track item) {
            <ion-select-option [value]="item">{{ item }}</ion-select-option>
          }
        </ion-select></ion-item
      >
      <ion-item
        ><ion-input label="Etiqueta de enlace" labelPlacement="stacked" formControlName="linkLabel"
      /></ion-item>
      <ion-item
        ><ion-input
          type="url"
          label="URL externa"
          labelPlacement="stacked"
          formControlName="linkUrl"
      /></ion-item>
      <ion-button type="submit" expand="block" [disabled]="saving()">Guardar</ion-button>
    </form>
    @if (message()) {
      <p class="error">{{ message() }}</p>
    }
  </main></ion-content
>
