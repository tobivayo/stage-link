name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://stagelink:stagelink_ci_password@localhost:5432/stagelink?schema=public
      JWT_SECRET: stagelink_ci_only_secret_with_at_least_32_characters
      JWT_EXPIRES_IN: 900
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stagelink
          POSTGRES_USER: stagelink
          POSTGRES_PASSWORD: stagelink_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stagelink -d stagelink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed base roles
        run: npm run db:seed

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
